<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="bingbot" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Private Server</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #5f6b7a;
      --line: #e3e6eb;
      --accent: #2f6fde;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1218;
        --card: #171b23;
        --text: #e6e9ef;
        --muted: #9aa4b2;
        --line: #262c37;
        --accent: #6c9bff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 36px 32px;
      text-align: center;
    }
    .icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      color: var(--accent);
    }
    h1 { margin: 0 0 10px; font-size: 22px; font-weight: 650; }
    p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.55; }
    .status {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--muted);
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #22a55b; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="11" width="16" height="10" rx="2"></rect>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
      </svg>
    </div>
    <h1>Private Server</h1>
    <p>This server is for authorized applications only. There is nothing to browse here.</p>
    <div class="status"><span class="dot"></span>Server is running</div>
  </main>
</body>
</html>
